<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ページが見つかりません | money-nav.com</title>
    <!-- 旧URLは HTTP 404 のまま返す。トップへリダイレクトするとソフト404が大量発生し、
         ドメイン全体の評価を下げるため、意図的に「消えた」ことを伝える。 -->
    <meta name="robots" content="noindex, follow" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0f16;
        color: #e8edf5;
        font-family:
          system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.8;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 20px;
        font-size: 0.9375rem;
        color: #94a3b8;
      }
      a {
        color: #38bdf8;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>このページはありません</h1>
      <p>お探しのページは公開されていません。</p>
      <a href="/">トップページへ</a>
    </main>
  </body>
</html>
